# Reference release pipeline: build a dummy artifact, keyless-sign with
# Sigstore (cosign), attest SLSA provenance, publish checksums + signature.
#
# Keyless signing writes the artifact digest and this workflow's identity to
# Sigstore's public Rekor transparency log. Only a dummy artifact is used.
#
# Least privilege: id-token:write only on sign; contents:write only on release;
# attestations:write only on sign. No pull_request_target.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default deny; each job opts in.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-dummy-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Reject anything that is not a plain semver tag before it is used.
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag must match ^v[0-9]+.[0-9]+.[0-9]+$" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          ARTIFACT="signed-release-${VERSION}.tar.gz"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "artifact=${ARTIFACT}" >>"${GITHUB_OUTPUT}"

      - name: Build dummy artifact
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/build-artifact.sh "$VERSION"

      - name: Upload dist
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  sign:
    name: sign-and-attest
    needs: build
    # Only tag pushes sign (and write to public Rekor); manual runs never sign.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Keyless sign-blob (writes to public Rekor)
        env:
          ARTIFACT: dist/${{ needs.build.outputs.artifact }}
        run: |
          set -euo pipefail
          # GitHub OIDC → Fulcio cert → Rekor transparency log (public).
          # Dummy artifact only. Do not point this at private payloads.
          cosign sign-blob \
            --yes \
            --bundle "${ARTIFACT}.cosign.bundle" \
            "${ARTIFACT}"
          ls -la "${ARTIFACT}.cosign.bundle"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/${{ needs.build.outputs.artifact }}

      - name: Upload signature bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-signature
          path: |
            dist/*.cosign.bundle
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish-github-release
    needs: [build, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist

      - name: Download signature
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-signature
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            dist/${{ needs.build.outputs.artifact }}
            dist/${{ needs.build.outputs.artifact }}.cosign.bundle
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
